<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="520" height="262" viewBox="0 0 520 262">
  <style>
    .t { font-family: 'Fira Code', 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; fill: #E9DDF7; }
    .dim { fill: #8E7AA8; }
    .ok { fill: #7FD6A8; }
    .warn { fill: #F2C46D; }
    .acc { fill: #C9A7F2; }
    .dots { stroke: #4A3C60; stroke-width: 1.4; stroke-dasharray: 1 4; stroke-linecap: round; }
    .ln { opacity: 0; animation: in 0.01s steps(1) forwards; }
    @keyframes in { to { opacity: 1; } }
    .cur { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
  </style>

  <rect width="520" height="262" rx="12" fill="#1C1528"/>
  <rect width="520" height="30" rx="12" fill="#2A2038"/>
  <rect y="18" width="520" height="12" fill="#2A2038"/>
  <circle cx="18" cy="15" r="5" fill="#F28FAD"/>
  <circle cx="36" cy="15" r="5" fill="#F2C46D"/>
  <circle cx="54" cy="15" r="5" fill="#7FD6A8"/>
  <text x="260" y="19" text-anchor="middle" class="t dim" style="font-size:11px">lilac@iiits — /dev/ttyUSB0 @ 115200</text>

  <g class="ln" style="animation-delay:0.3s">
    <text x="18" y="56" class="t"><tspan class="acc">lilac@iiits:~$ </tspan>./boot --verbose</text>
  </g>

  <g class="ln" style="animation-delay:0.9s">
    <text x="18" y="80" class="t"><tspan class="dim">[</tspan><tspan class="ok"> OK </tspan><tspan class="dim">]</tspan></text>
    <text x="72" y="80" class="t">configuring clock tree</text>
    <line x1="246" y1="76" x2="296" y2="76" class="dots"/>
    <text x="304" y="80" class="t dim">480 MHz</text>
  </g>

  <g class="ln" style="animation-delay:1.4s">
    <text x="18" y="104" class="t"><tspan class="dim">[</tspan><tspan class="ok"> OK </tspan><tspan class="dim">]</tspan></text>
    <text x="72" y="104" class="t">mounting /dev/ece</text>
    <line x1="210" y1="100" x2="296" y2="100" class="dots"/>
    <text x="304" y="104" class="t dim">IIIT Sri City · '28</text>
  </g>

  <g class="ln" style="animation-delay:1.9s">
    <text x="18" y="128" class="t"><tspan class="dim">[</tspan><tspan class="ok"> OK </tspan><tspan class="dim">]</tspan></text>
    <text x="72" y="128" class="t">loading drivers</text>
    <line x1="196" y1="124" x2="296" y2="124" class="dots"/>
    <text x="304" y="128" class="t dim">DMA · SPI · UART · I2C</text>
  </g>

  <g class="ln" style="animation-delay:2.4s">
    <text x="18" y="152" class="t"><tspan class="dim">[</tspan><tspan class="ok"> OK </tspan><tspan class="dim">]</tspan></text>
    <text x="72" y="152" class="t">starting scheduler</text>
    <line x1="218" y1="148" x2="296" y2="148" class="dots"/>
    <text x="304" y="152" class="t dim">FreeRTOS</text>
  </g>

  <g class="ln" style="animation-delay:2.9s">
    <text x="18" y="176" class="t"><tspan class="dim">[</tspan><tspan class="ok"> OK </tspan><tspan class="dim">]</tspan></text>
    <text x="72" y="176" class="t">linking ml runtime</text>
    <line x1="218" y1="172" x2="296" y2="172" class="dots"/>
    <text x="304" y="176" class="t dim">INT8 · tiny hardware</text>
  </g>

  <g class="ln" style="animation-delay:3.5s">
    <text x="18" y="200" class="t"><tspan class="dim">[</tspan><tspan class="warn">WARN</tspan><tspan class="dim">]</tspan></text>
    <text x="72" y="200" class="t">bringing up stm32 HAL</text>
    <line x1="240" y1="196" x2="296" y2="196" class="dots"/>
    <text x="304" y="200" class="t warn">still fighting it</text>
  </g>

  <g class="ln" style="animation-delay:4.1s">
    <text x="18" y="224" class="t"><tspan class="dim">[</tspan><tspan class="ok"> OK </tspan><tspan class="dim">]</tspan></text>
    <text x="72" y="224" class="t">all systems nominal</text>
    <line x1="226" y1="220" x2="296" y2="220" class="dots"/>
    <text x="304" y="224" class="t acc">hi, I'm Tishya ✿</text>
  </g>

  <g class="ln" style="animation-delay:4.6s">
    <text x="18" y="248" class="t acc">lilac@iiits:~$</text>
    <rect x="134" y="238" width="8" height="13" fill="#C9A7F2" class="cur"/>
  </g>
</svg>
